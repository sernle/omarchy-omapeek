[package]
name = "omapeek-desktop"
version = "0.2.0"
edition = "2021"
rust-version = "1.86"
description = "Cross-platform Tauri v2 Quick Look + offline safety shield for macOS and Linux (Omarchy)."

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
